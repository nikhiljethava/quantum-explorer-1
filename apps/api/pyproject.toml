[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-quantum-workload-navigator-api"
version = "0.1.0"
description = "FastAPI backend and worker for Hybrid Quantum Workload Navigator."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.1,<4.0",
  "pydantic>=2.7,<3.0",
  "httpx>=0.27,<1.0",
  "cirq",
  "openfermion",
  "qualtran"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[project.scripts]
navigator-worker = "app.worker.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
