services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: navigator
      POSTGRES_USER: navigator
      POSTGRES_PASSWORD: navigator
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navigator -d navigator"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/apps/api:/app/packages/agents/src
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.worker
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/apps/api:/app/packages/agents/src
    volumes:
      - .:/app
    command:
      - python
      - -m
      - app.worker.main

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - .env
    depends_on:
      api:
        condition: service_started
    environment:
      API_INTERNAL_BASE_URL: http://api:8000
    volumes:
      - .:/app
      - web_node_modules:/app/apps/web/node_modules
    ports:
      - "3000:3000"
    command:
      - npm
      - run
      - dev
      - --
      - --hostname
      - 0.0.0.0
      - --port
      - "3000"

volumes:
  postgres_data:
  web_node_modules:
